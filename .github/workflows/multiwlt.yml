name: MultiWLT research checks
on:
  push:
    paths: ['multiwlt/**', '.github/workflows/multiwlt.yml']
  pull_request:
    paths: ['multiwlt/**', '.github/workflows/multiwlt.yml']
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: multiwlt/requirements.txt
      - run: python -m pip install -r multiwlt/requirements.txt
      - run: python -m pytest tests -q
        working-directory: multiwlt
      - run: python demo.py --output demo_output
        working-directory: multiwlt
